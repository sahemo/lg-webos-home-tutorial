<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Still Home</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#080b16;color:#f3f5ff;font-family:Arial,sans-serif;overflow:hidden}
    #home{display:block;width:100%;height:100%;border:0;background:#080b16}
    .qr-card{position:fixed;z-index:3;top:auto;bottom:3vh;left:auto;right:3vw;width:150px;padding:11px 10px 9px;transform:none;border:1px solid rgba(55,230,255,.48);border-radius:12px;background:linear-gradient(145deg,#101a2d,#151126);box-shadow:0 14px 42px #0009,0 0 24px #25d7f322;text-align:center;transition:opacity .15s ease}
    .qr-card[hidden]{display:none}
    .qr-title{color:#55edf4;font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:8px}.qr-frame{width:100%;aspect-ratio:1;padding:7px;background:#fff;border-radius:7px}.qr-frame img{width:100%;height:100%;display:block}.qr-label{color:#f5f7ff;font-size:17px;line-height:1.15;font-weight:800;letter-spacing:.08em;margin-top:5px}
    @media(max-width:1500px){.qr-card{top:auto;bottom:3vh;left:auto;right:3vw;width:132px;padding:9px;transform:none}.qr-title{font-size:10px}.qr-label{font-size:15px}}
    @media(max-width:1100px){.qr-card{top:auto;bottom:3vh;left:auto;right:3vw;width:116px;padding:8px;transform:none}.qr-title{font-size:9px}.qr-label{font-size:13px}}
  </style>
</head>
<body>
  <iframe id="home" title="Still Home dashboard" src="https://YOUR_HOMEPAGE.workers.dev/"></iframe>
</body>
</html>
